name: verify

on:
  pull_request:
  push:
    branches: [main]

# Superseded pull-request runs cancel. Pushes to main are given a group of their
# own per run, so a later push neither cancels nor queues behind an earlier one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # `fetch-depth: 0` because `tools/verify-migrations.mjs` compares the
      # migration folder against the merge-base with the base ref, and against
      # the push event's `before` SHA on a push to main. Fetching only the base
      # ref is not claimed sufficient: Git may still lack the head-side ancestry
      # needed to establish a merge-base, and the verifier fails closed rather
      # than skipping (ADR 0017).
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No `version` input: the action reads the exact pnpm version from the
      # root `packageManager` field, so this activates the project version
      # rather than declaring a second one. `standalone` installs the
      # Node.js-bundled pnpm executable, which does not depend on the runner's
      # Node.js. Checkout has to come first for `packageManager` to be readable.
      - name: Activate the project pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true

      # `cache: pnpm` persists only pnpm's content-addressed store, keyed by the
      # committed lockfile and the runner platform. It never caches node_modules.
      - name: Activate Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      # The tenancy tests measure a real Postgres behind a real PgBouncer in
      # transaction mode, because the failures ADR 0008's rules 2 and 3 exist for
      # are only observable on a pooled connection: session state outliving the
      # client that set it, and reaching one that set nothing. They fail rather
      # than skip when it is absent, so the stack comes up before `pnpm verify`
      # rather than inside it. Compose v2 is preinstalled on ubuntu-latest.
      - name: Start the database stack
        run: docker compose -f tools/db/compose.yaml up -d --wait

      - name: Verify
        run: pnpm verify
