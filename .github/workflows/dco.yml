name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-signoff:
    name: Check sign-off
    runs-on: ubuntu-latest
    steps:
      # The default pull_request checkout is refs/pull/N/merge, which has both
      # base.sha and head.sha as ancestors - so the full range is present here
      # for fork pull requests too.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every commit carries a Signed-off-by
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          missing=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            # Merge commits are generated rather than authored; they carry no
            # sign-off. A merge has more than one parent.
            if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then
              continue
            fi

            subject="$(git show -s --format='%h %s' "$sha")"
            if git show -s --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>[[:space:]]*$'; then
              echo "ok       $subject"
            else
              echo "MISSING  $subject  ($(git show -s --format='%an <%ae>' "$sha"))"
              missing=$((missing + 1))
            fi
          done

          if [ "$missing" -eq 0 ]; then
            echo "All commits signed off."
            exit 0
          fi

          echo
          echo "$missing commit(s) are missing a Developer Certificate of Origin sign-off."
          echo
          echo "Reprove requires every commit to certify that you have the right to"
          echo "submit it under Apache-2.0. See CONTRIBUTING.md."
          echo
          echo "Fix the most recent commit:"
          echo "    git commit --amend -s && git push --force-with-lease"
          echo
          echo "Fix every commit on the branch:"
          echo "    git rebase --signoff main && git push --force-with-lease"
          exit 1
