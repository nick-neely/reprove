name: Bug report
description: Something in Reprove behaves incorrectly.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: if this is a **security** problem - a way to reach a
        harness credential, escape a Sandbox, or make a Reviewer act on
        repository-controlled instructions - do not open an issue. Follow
        [SECURITY.md](https://github.com/nick-neely/reprove/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The behavior you observed, not the behavior you expected.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >
        The smallest sequence that reproduces it. A link to a public pull
        request that triggered the behavior is the most useful thing you can
        give us.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: worker
    attributes:
      label: Worker
      description: Who operates the Worker that executed the Run?
      options:
        - Hosted (Reprove Cloud)
        - Self-hosted
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: harness
    attributes:
      label: Harness
      options:
        - Codex
        - Claude Code
        - OpenCode
        - Not applicable
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: autonomy
    attributes:
      label: Autonomy
      description: What the Reviewer was permitted to do.
      options:
        - inspect
        - verify
        - fix
        - Not applicable
        - Not sure
    validations:
      required: true

  - type: input
    id: run
    attributes:
      label: Run
      description: >
        The Run identifier, if you have one, or a link to the GitHub Check or
        Review it produced.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        For a self-hosted Worker: OS, Node.js version, Reprove version, and the
        harness CLI version. Skip for hosted.
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: >
        Logs or error output. **Redact credentials and any private source code**
        before pasting - agent output can quote the repository under review.
      render: text
