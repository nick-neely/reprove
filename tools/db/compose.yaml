# The local database stack, and the two endpoints ADR 0008's connection table
# names:
#
#   postgres:5432   direct   -> the admin / migration role
#   pgbouncer:6432  pooled   -> the restricted runtime role, transaction pooling
#
# Published on 55532 and 56532, deliberately away from the obvious 55432/56432:
# a developer machine commonly already has a Postgres on those, and a stack that
# silently collided with one would either refuse to start or, worse, point these
# tests at somebody else's database.
#
# PgBouncer is not convenience. A pooler in transaction mode hands one server
# connection to client after client without scrubbing session state, and that is
# what ADR 0008's rules 2 and 3 exist for: a bare `SET` outlives the client that
# issued it, and so does the empty string a custom GUC is left as once anything
# has set it. Both are reproduced against this stack, along with the predicate
# that turns the second into an outage. A stack without a pooler would prove the
# tenant boundary against an arrangement production does not run.
#
# `docker compose -f tools/db/compose.yaml up -d --wait`, or `pnpm db:up`.
# Docker is the only prerequisite; nothing here needs a local Postgres.

# Named, so the project is not the enclosing directory. `tools/db` would give
# every machine a Compose project called `db`.
name: reprove-db

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reprove
      # Trust auth, because nothing in this stack is a secret: it is a local
      # development database and CI service, and the credentials the tests use
      # are checked into this repository beside it.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "55532:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reprove"]
      interval: 1s
      timeout: 3s
      retries: 30

  pgbouncer:
    # Pinned rather than `latest`, so the pooler this repository proves the
    # tenant boundary against is the same one on every machine and in CI.
    image: edoburu/pgbouncer:v1.25.2-p0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "56532:6432"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 1s
      timeout: 3s
      retries: 30
