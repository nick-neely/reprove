[databases]
; Every database, routed through to Postgres under the name the client asked
; for. Each test file creates and drops a database of its own, so the wildcard
; is what keeps the pooler out of that arrangement.
* = host=postgres port=5432

; The same server, through a pool of exactly ONE server connection. Reuse is
; then deterministic rather than load-dependent, which is the only way the
; pooled-endpoint tenant leak is observable on demand instead of under load.
reprove_pinned = host=postgres port=5432 dbname=reprove_pinned pool_size=1

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt

; The whole point of this file. Session pooling would hold one server
; connection per client and hide every failure the pooled endpoint has.
pool_mode = transaction

max_client_conn = 200
default_pool_size = 20

; Deliberately empty, and deliberately not `DISCARD ALL`. Neon does not scrub
; session state between transactions either, so a stack that scrubbed it would
; hide the exact failure this file exists to reproduce.
server_reset_query =
server_reset_query_always = 0

ignore_startup_parameters = extra_float_digits,search_path
admin_users = postgres
