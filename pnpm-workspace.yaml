# ADR 0010 requires explicit workspace globs. `prototypes/**` stays outside the
# workspace so its throwaway dependencies and lockfiles never join this graph.
packages:
  - packages/*
  - apps/*

# Shared versions live in the default catalog so one bump moves every workspace.
# The Harness catalog pins core to the exact version required by its bridge.
catalog:
  "@types/node": ^24.13.4
  typescript: ^7.0.2
  vitest: ^5.0.0
  zod: ^4.5.4

# The Workflow family moves together, and it is pinned rather than ranged: the
# build behaviour the orchestration seam depends on is undocumented and
# version-specific (ADR 0014), so a version bump is a reviewed change that reruns
# the real-builder gate rather than something a range lets in on its own.
catalogs:
  harness:
    "@ai-sdk/harness": 1.0.102
    "@ai-sdk/harness-codex": 1.0.104
  workflow:
    workflow: 4.8.5
    "@workflow/world-postgres": 4.3.5
    "@workflow/vitest": 4.0.21

# --- Package manager selection -------------------------------------------------
# pnpm 11 removed `managePackageManagerVersions` and `packageManagerStrict`.
# `pmOnFail: error` is the v11 spelling of "a mismatched running pnpm fails":
# pnpm errors instead of downloading a different version or merely warning.
pmOnFail: error

# --- Hoisting ------------------------------------------------------------------
# Strict layout by default, which ADR 0010 calls defence in depth: a workspace
# resolves only what it declared. One package is hoisted to the root, for the
# Workflow test builder rather than for any Reprove code. `@workflow/vitest`'s
# step bundler resolves each bare specifier from the project root to decide
# whether to keep it external, and under the strict layout `builtin-modules` -
# reached through the SDK's own serde checker, which the bundler pulls into
# every step bundle - resolves from nowhere but its importer. The bundler then
# inlines the package and externalizes its JSON import as a relative path,
# dropping the `with { type: "json" }` attribute Node requires, so every step
# fails to load. Hoisted, it resolves from the package root and stays a bare
# import that Node loads correctly. Measured against `workflow@4.8.5`; revisit
# when the Workflow catalog moves.
publicHoistPattern:
  - builtin-modules

# --- Supply chain (issue #30) --------------------------------------------------
# A version must be 24h old before it may be installed.
minimumReleaseAge: 1440
# Reject a package whose publish authentication got weaker than it was.
trustPolicy: no-downgrade
# Reviewed exceptions, each pinned to the exact version so a later one is
# re-checked. Every entry states its reason and ends with a `review-by` date;
# tools/verify-workspace.mjs fails once that date passes, so an exception cannot
# settle into a permanent silent allowlist (issue #30).
trustPolicyExclude:
  # `undici-types@6.21.0` is the transitive dependency of `@types/node@^22` and
  # is the only version in its `~6.21.0` range. Not the catalog's `@types/node`,
  # which is the 24 line: this one arrives under `@workflow/world-postgres`,
  # through `graphile-worker` and `graphile-config` - `pnpm why undici-types`
  # shows both trees. Earlier 6.x releases carried a provenance attestation and
  # this one does not, which pnpm reports as a downgrade. It is a publishing gap
  # in the upstream release, not a takeover: the package is types-only, ships no
  # runtime code and no install script. Revisit when that `@types/node@22` moves
  # off it.
  # review-by: 2026-12-01
  - undici-types@6.21.0
  # `chokidar@4.0.3` is the transitive dependency of `workflow`'s CLI, which the
  # SDK ships as a dependency. It was published in December 2024 by the package's
  # long-standing maintainer without the provenance attestation `4.0.1` carried,
  # which pnpm reports as a downgrade. It is a publishing gap rather than a
  # takeover: the version is twenty months old, is what every Vite install
  # resolves, and ships no install script. Revisit when `@workflow/cli` moves
  # off it.
  # review-by: 2027-03-01
  - chokidar@4.0.3
  # Four Vercel-published packages arrive under `@workflow/world-postgres`, through
  # `@vercel/queue`, and one more under `workflow`'s CLI. Every one is published
  # from Vercel's own GitHub Actions through npm's trusted-publisher flow - the
  # registry records `npm-oidc-no-reply@github.com` as the publisher - and pnpm
  # still reports a downgrade because an earlier version of each also carried a
  # provenance attestation and these do not. That is the same publishing gap as
  # above, on packages that ship no install script. Each is pinned; a bump is
  # re-checked. Revisit when the Workflow catalog moves.
  # review-by: 2027-03-01
  - "@vercel/functions@3.9.5"
  # review-by: 2027-03-01
  - "@vercel/oidc@3.8.5"
  # review-by: 2027-03-01
  - "@vercel/cli-exec@1.0.1"
  # review-by: 2027-03-01
  - "@vercel/cli-config@0.2.4"
  # `@swc/core@1.15.3` is a peer of `@workflow/nest`, which `workflow` carries for
  # every framework it integrates with; its ten platform binaries are optional
  # dependencies published in November 2025 without the attestation earlier
  # builds carried. The binaries carry no install script (the `postinstall` is on
  # `@swc/core` itself, denied under `allowBuilds` below) and the version is what
  # every current swc consumer resolves. Ten entries because pnpm judges each
  # platform package on its own. Revisit when the Workflow catalog moves.
  # review-by: 2027-03-01
  - "@swc/core-darwin-arm64@1.15.3"
  # review-by: 2027-03-01
  - "@swc/core-darwin-x64@1.15.3"
  # review-by: 2027-03-01
  - "@swc/core-linux-arm-gnueabihf@1.15.3"
  # review-by: 2027-03-01
  - "@swc/core-linux-arm64-gnu@1.15.3"
  # review-by: 2027-03-01
  - "@swc/core-linux-arm64-musl@1.15.3"
  # review-by: 2027-03-01
  - "@swc/core-linux-x64-gnu@1.15.3"
  # review-by: 2027-03-01
  - "@swc/core-linux-x64-musl@1.15.3"
  # review-by: 2027-03-01
  - "@swc/core-win32-arm64-msvc@1.15.3"
  # review-by: 2027-03-01
  - "@swc/core-win32-ia32-msvc@1.15.3"
  # review-by: 2027-03-01
  - "@swc/core-win32-x64-msvc@1.15.3"
# Installation fails on an unreviewed lifecycle script rather than skipping it.
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
# Every dependency lifecycle script is decided explicitly. `true` admits it,
# `false` records a reviewed denial. `pnpm approve-builds --all` is never used.
allowBuilds:
  # Three copies of esbuild arrive under `drizzle-kit`, which `@reprove/control-plane`
  # uses to generate migrations (issue #44): one directly, one through `tsx`, and one
  # through the `@esbuild-kit` loader `drizzle-kit` still carries. Each ships a
  # `postinstall` that re-resolves its platform binary, which is work pnpm has already
  # done - `@esbuild/linux-x64` and its siblings install as ordinary optional
  # dependencies, and esbuild resolves the binary from one of them at run time.
  # Denied rather than admitted, because an install-time script that may reach the
  # network is the surface issue #30 closed, and denying it costs nothing here:
  # `drizzle-kit --version` and `drizzle-kit generate` both work with all three
  # denied. Each key pins an exact version, so a bump is reviewed again.
  esbuild@0.18.20: false
  esbuild@0.25.12: false
  esbuild@0.28.2: false
  # Two more arrive with the Workflow family (issue #50). `@swc/core`'s
  # `postinstall` re-checks that a native binding is present and would download
  # one if not; pnpm has already installed the platform binary as an optional
  # dependency, so the script is redundant here and denied for the same reason
  # esbuild's is. `cbor-extract`'s `install` builds a native accelerator for
  # `cbor-x`, which the Postgres World uses to encode messages and which falls
  # back to its pure JavaScript path when the binding is absent - measured by the
  # real-builder gate executing a workflow with the build denied.
  "@swc/core@1.15.3": false
  cbor-extract@2.2.2: false

# --- Security overrides --------------------------------------------------------
# `@workflow/core@4.8.5` - reached from every workspace through `workflow` and
# `@workflow/vitest` - pins `nanoid` to exactly `5.1.6`, which carries two high
# severity advisories: GHSA-xwg4-73v4-xw9w (integer overflow or wraparound,
# patched in 5.1.11) and GHSA-28wg-ghj8-5hjv (non-secure generators can loop
# indefinitely with a negative size, patched in 5.1.16). `dependency-review`
# fails the branch on both. 5.1.16 is the lowest 5.x release clear of the pair
# and is a patch-level move within the same major, so the API `@workflow/core`
# calls is unchanged. An override rather than waiting on upstream because the
# pin is exact: a `workflow` bump is the only thing that can move it, and ADR
# 0014 makes that a reviewed change on its own schedule. Remove this once the
# workflow catalog moves to a release whose `@workflow/core` asks for 5.1.16 or
# later - check `pnpm why nanoid` after the bump.
# review-by: 2027-03-01
overrides:
  nanoid@5: 5.1.16
  # `@workflow/world-local@4.4.0` and `@workflow/world-vercel@4.7.1` - both
  # reached from every workspace through `workflow` and `@workflow/vitest` - pin
  # `undici` to exactly `7.28.0`, which carries GHSA-4cwx-7wf7-3272
  # (CVE-2026-13697, high severity): cross-user information disclosure and a
  # parse-time crash from degenerate private cache directives, affecting
  # `>= 7.0.0, < 7.29.0`. `dependency-review` fails the branch on it. 7.29.0 is
  # the lowest 7.x release clear of it - and of the four medium advisories that
  # share the same fix - and is a minor move within the same major, so the API
  # the Worlds call is unchanged. An override for the same reason `nanoid` has
  # one: the pin is exact, so a `workflow` bump is the only thing that can move
  # it, and ADR 0014 makes that a reviewed change on its own schedule. Remove
  # this once the workflow catalog moves to a release whose Worlds ask for
  # 7.29.0 or later - check `pnpm why undici` after the bump.
  # review-by: 2027-03-01
  undici@7: 7.29.0
