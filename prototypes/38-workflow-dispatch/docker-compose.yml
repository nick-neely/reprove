# PROTOTYPE, wipe me. Two databases on one server, deliberately:
#   reprove  - ADR 0008's tenant-scoped schema (a minimal subset; #37 owns the full one)
#   world    - Vercel Workflow's own storage, to show what it actually creates
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: world
      POSTGRES_PASSWORD: world
      POSTGRES_DB: world
    ports: ["55438:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U world"]
      interval: 1s
      timeout: 3s
      retries: 30
