[databases]
; Ordinary runtime traffic. Needs a few server connections so two deliveries can
; genuinely contend on the advisory lock rather than queueing at the pooler.
reprove_proto = host=postgres port=5432 dbname=reprove_proto pool_size=10

; The same database through a pool of exactly ONE server connection, so the next
; client provably inherits the previous client's session state. This is how the
; Neon pooled-endpoint hazard is made deterministic instead of load-dependent.
reprove_proto_pinned = host=postgres port=5432 dbname=reprove_proto pool_size=1

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt

; The whole point of this file.
pool_mode = transaction

max_client_conn = 100
default_pool_size = 10

; Left at PgBouncer's transaction-mode default (not run) rather than forced on.
; Neon does not scrub session state between transactions either, and a prototype
; that scrubbed it would hide the exact failure this exists to show.
server_reset_query =
server_reset_query_always = 0

ignore_startup_parameters = extra_float_digits,search_path
admin_users = postgres
